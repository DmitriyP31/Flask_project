<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <title>{% block title %}My Flask App{% endblock %}</title>
</head>
<body>
    <header>
        <nav class="nav">
            <div style="visibility: hidden; margin-right: auto;">Hidden</div>
            <img src="{{url_for('static', filename='image/flask_icons.png')}}">
            <a href="/" class="nav-link">Home</a>
            <a href="/about" class="nav-link">About Us</a>
            <a href="/contact" class="nav-link">Contacts</a>
            <p class="time">Today: {{ current_time.strftime('%A, %B %d, %Y, %H:%M:%S') }}</p>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 My Flask App</p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
